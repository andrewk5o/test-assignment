server {
    listen 80;
    root /usr/share/nginx/html; # Vite build output copied here by Dockerfile
    index index.html;

    # DNS used to resolve service hostnames at request time.
    # Patched at startup by docker-entrypoint.d-resolver.sh to match the actual
    # runtime DNS (Docker uses 127.0.0.11; Podman/K8s use a different address).
    # valid=10s: re-resolve after 10 s so a restarted backend is picked up quickly.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # Variable forces nginx to go through the resolver on every request.
        # Without it, nginx resolves "backend" once at startup and caches forever —
        # breaking the proxy if the backend container restarts.
        set $backend backend;
        proxy_pass http://$backend:8080;
        proxy_set_header Host $host; # Forward original Host header to the backend
    }

    location / {
        # Serve real files (JS/CSS/images); fall back to index.html for
        # client-side routes so the React router handles them instead of 404.
        try_files $uri /index.html;
    }
}
